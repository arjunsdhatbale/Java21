# ═══════════════════════════════════════════════════════════════════════════════
# NOTIFICATION & EMAIL MASTER FEATURE TOGGLE
# When false, all WebSocket notifications, emails, and SMS alerts are skipped.
# When true, real notifications and emails are active.
# ═══════════════════════════════════════════════════════════════════════════════
app.notification.enabled=true
notification.feature.enabled=true
app.notification.email.enabled=true

# ═══════════════════════════════════════════════════════════════════════════════
# GMAIL SMTP CONFIGURATION (Required for real email delivery to user inboxes)
# ─────────────────────────────────────────────────────────────────────────────
# Steps to receive emails at your real inbox (e.g. Gmail):
# 1. Provide your Gmail address in spring.mail.username below.
# 2. Go to your Google Account -> Security -> 2-Step Verification -> App Passwords
# 3. Create an App Password for "Mail" / "Java21", copy the 16-letter password.
# 4. Paste it in spring.mail.password below (without spaces).
# ═══════════════════════════════════════════════════════════════════════════════
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:arjundhatbale543210@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

app.notification.email.from=${APP_NOTIFICATION_EMAIL_FROM:arjundhatbale543210@gmail.com}
app.notification.email.app-url=http://localhost:8082

# ═══════════════════════════════════════════════════════════════════════════════
# TEMPORARY SECURITY CREDENTIALS
# ═══════════════════════════════════════════════════════════════════════════════
spring.security.user.name=user
spring.security.user.password=password

# ═══════════════════════════════════════════════════════════════════════════════
# GOOGLE OAUTH2 CLIENT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend Angular Redirect Target after OAuth2 login
app.oauth2.authorized-redirect-url=http://localhost:4200/oauth2/callback

